services:
  db:
    image: postgres:16-alpine
    container_name: mindease_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindease_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mindease_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mindease_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mindease_ai
      SYNC_DATABASE_URL: postgresql://postgres:postgres@db:5432/mindease_ai
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      CREATE_TABLES_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.main"

  seed:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mindease_seed
    restart: "no"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mindease_ai
      SYNC_DATABASE_URL: postgresql://postgres:postgres@db:5432/mindease_ai
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: >
      sh -c "python seed_data.py"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: mindease_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data: